name: ci-vision

on:
  pull_request:
    paths: &paths
      - "ml/vision/**"
      - "packages/schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-vision.yml"
      - ".github/workflows/_python-area.yml"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vision:
    uses: ./.github/workflows/_python-area.yml
    with:
      package: dermiai-vision
      path: ml/vision
