name: ci-llm

on:
  pull_request:
    paths: &paths
      - "ml/llm/**"
      - "packages/schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-llm.yml"
      - ".github/workflows/_python-area.yml"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm:
    uses: ./.github/workflows/_python-area.yml
    with:
      package: dermiai-llm
      path: ml/llm
