version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: / # npm workspace root (apps/web + packages/schemas)
    schedule: { interval: monthly }
    groups:
      npm-minor:
        update-types: [minor, patch]
