<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dermi character</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="100%" height="100%" viewBox="0 0 120 120" role="img" aria-label="{{label}}">
<path d="M40 112.5 Q60 109.5 84 112" fill="none" stroke="#16587B" stroke-width="2" stroke-linecap="round" opacity="0.45"></path>
<path d="M61 20C86 18 105 37 104 64C103 91 85 107 60 106C35 105 18 90 19 65C19 40 36 22 61 20Z" fill="{{body}}"></path>
<path d="M51 18.6C78 12.5 103.5 31 103.5 61.5C104.5 90 86 105.5 59 104.8C33 104.2 15.8 88.6 16.2 63.2C16.4 40.5 30.5 22.6 55.5 17.8" fill="none" stroke="#16587B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M32 43.5Q35.5 35 43.5 31.5" fill="none" stroke="#F5EEDD" stroke-width="3.2" stroke-linecap="round"></path>
<path d="M30.5 72.5l4.5-3.2M34.5 74.6l4.5-3.2M81 69.4l4.5 3.2M85 67.3l4.5 3.2" fill="none" stroke="#16587B" stroke-width="1.5" stroke-linecap="round" opacity="0.5"></path>
<path d="{{brows}}" fill="none" stroke="#16587B" stroke-width="2.4" stroke-linecap="round"></path>
<ellipse cx="{{eyeL}}" cy="{{eyeY}}" rx="3.4" ry="4.4" fill="#16587B" transform="rotate(-6 {{eyeL}} {{eyeY}})"></ellipse>
<ellipse cx="{{eyeR}}" cy="{{eyeY}}" rx="3.8" ry="4.7" fill="#16587B" transform="rotate(5 {{eyeR}} {{eyeY}})"></ellipse>
<path d="{{mouth}}" fill="none" stroke="#16587B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":120,"min":16,"max":480},"mood":{"editor":"enum","default":"happy","options":["happy","thinking","concerned"]},"body":{"editor":"color","default":"#A9CBDD","options":["#A9CBDD","#84B3CE","#F5EEDD"]},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 120);
    const mood = this.props.mood ?? 'happy';
    const faces = {
      happy: { eyeL: 47, eyeR: 74, eyeY: 58, mouth: 'M50.5 71.5 Q57 79.5 69.5 72', brows: '' },
      thinking: { eyeL: 51, eyeR: 77, eyeY: 54, mouth: 'M57 74.5 Q61.5 72.5 66.5 74', brows: 'M46 45.5 Q51 42 56.5 44' },
      concerned: { eyeL: 47, eyeR: 74, eyeY: 59, mouth: 'M52 76 Q60 71.5 68.5 75.5', brows: 'M40 50.5 L50.5 46.5 M70.5 46.2 L81 50.8' }
    };
    const f = faces[mood] || faces.happy;
    return { px: size + 'px', body: this.props.body ?? '#A9CBDD', label: 'Dermi, your skin-health companion', ...f };
  }
}
</script>
</body>
</html>
