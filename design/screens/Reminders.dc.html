<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DermiAI – Reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Poppins:wght@300;400;500&display=swap">
<style>
body{margin:0;background:#F5EEDD}
a{color:#16587B}a:hover{color:#0F3D56}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #F5EEDD; font-family: 'Poppins', system-ui, sans-serif; font-weight: 300; color: #0F3D56; display: flex; flex-wrap: wrap">

<div style="flex: 1 1 240px; background: #FBF7EC; border-right: 1px solid #D8D2C0">
<dc-import name="Sidebar" active="reminders" hint-size="100%,860px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px clamp(16px, 3vw, 48px) 56px; display: flex; flex-direction: column; gap: 32px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #16587B">
<h1 style="margin: 0; font-family: 'Ortica', 'Newsreader', Georgia, serif; font-weight: 300; font-size: 52px; letter-spacing: -0.03em; color: #16587B">Reminders</h1>
<span style="font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #16587B">Small, gentle nudges</span>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">

<section aria-label="Your reminders" style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 140px 1fr; gap: 20px; align-items: start">
<h2 style="margin: 0; padding-top: 18px; font-size: 14px; font-weight: 400">{{g.name}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid #16587B">
<sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
<li style="display: grid; grid-template-columns: 96px 1fr auto 52px; align-items: center; gap: 14px; min-height: 72px; border-bottom: 1px solid #D8D2C0; opacity: {{r.opacity}}">
<span style="display: flex; align-items: baseline; gap: 3px; color: #16587B"><span style="font-family: 'Ortica', 'Newsreader', Georgia, serif; font-weight: 300; font-size: 32px; letter-spacing: -0.02em">{{r.hm}}</span><span style="font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.08em">{{r.ap}}</span></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 16px; font-weight: 400">{{r.title}}</span>
<span style="font-size: 13px; color: #4D6878">{{r.repeat}}</span>
</span>
<sc-if value="{{r.hasCase}}" hint-placeholder-val="{{ false }}">
<span style="padding: 4px 8px; border-radius: 4px; background: #D5E5EE; font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase">{{r.caseName}}</span>
</sc-if>
<sc-if value="{{r.noCase}}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
<button type="button" aria-pressed="{{r.pressed}}" aria-label="{{r.title}} reminder" onClick="{{r.toggle}}" style="{{r.track}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{r.knob}}"></span></button>
</li>
</sc-for>
</ul>
</div>
</sc-for>
</section>

<section aria-labelledby="new-h" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px; padding: 28px; border-radius: 10px; background: #FBF7EC; border: 1px solid #D8D2C0">
<h2 id="new-h" style="margin: 0; padding-bottom: 14px; border-bottom: 1px solid #16587B; font-family: 'Ortica', 'Newsreader', Georgia, serif; font-weight: 300; font-size: 34px; letter-spacing: -0.02em; color: #16587B">New reminder</h2>

<div style="display: flex; flex-direction: column; gap: 10px">
<span id="type-l" style="font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #16587B">Type</span>
<div role="group" aria-labelledby="type-l" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="5">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<label for="rem-name" style="display: flex; flex-direction: column; gap: 8px; font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #16587B">Name
<input id="rem-name" type="text" value="{{draftName}}" onChange="{{onName}}" style="min-height: 46px; padding: 0 2px; border: 0; border-bottom: 1.5px solid #16587B; background: transparent; font: 300 16px 'Poppins', sans-serif; letter-spacing: 0; text-transform: none; color: #0F3D56"></label>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 16px">
<label for="rem-time" style="display: flex; flex-direction: column; gap: 8px; font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #16587B">Time
<input id="rem-time" type="time" value="18:00" style="min-height: 46px; padding: 0 2px; border: 0; border-bottom: 1.5px solid #16587B; background: transparent; font: 300 16px 'Poppins', sans-serif; letter-spacing: 0; color: #0F3D56"></label>
<label for="rem-case" style="display: flex; flex-direction: column; gap: 8px; font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #16587B">Link to a case
<select id="rem-case" style="min-height: 46px; padding: 0; border: 0; border-bottom: 1.5px solid #16587B; background: transparent; font: 300 16px 'Poppins', sans-serif; letter-spacing: 0; text-transform: none; color: #0F3D56"><option>Contact dermatitis</option><option>Hormonal acne</option><option>Dark spot</option><option>None</option></select></label>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span id="rep-l" style="font-family: 'Fustat', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #16587B">Repeat</span>
<div role="group" aria-labelledby="rep-l" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{repeats}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.pressed}}" aria-label="{{d.full}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.short}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid #D8D2C0; border-bottom: 1px solid #D8D2C0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 400">Gentle follow-up</span><span style="font-size: 13px; color: #4D6878">Nudge again after 15 minutes if not done</span></span>
<button type="button" aria-pressed="{{nudgeStr}}" aria-label="Gentle follow-up" onClick="{{toggleNudge}}" style="{{nudgeTrack}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{nudgeKnob}}"></span></button>
</div>

<button type="button" onClick="{{save}}" style="min-height: 52px; border: 0; border-radius: 8px; background: #16587B; color: #F5EEDD; font: 500 13px 'Fustat', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer">Save reminder</button>

<div style="display: flex; gap: 12px; align-items: flex-end">
<dc-import name="Dermi" size="48" mood="happy" hint-size="48px,48px"></dc-import>
<p style="margin: 0; font-family: 'Ortica', 'Newsreader', Georgia, serif; font-weight: 300; font-size: 18px; line-height: 1.35; color: #16587B">Outdoors? Sunscreen works best reapplied about every two hours.</p>
</div>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      on: { m1: true, m2: true, d1: true, e1: true, n1: true, n2: false },
      extra: [], type: 'Medication', repeat: 'Every day', days: [0, 1, 2, 3, 4, 5, 6], nudge: true, name: 'Apply prescribed cream'
    };
  }
  renderVals() {
    const set = (o) => this.setState(o);
    const base = [
      { g: 'Morning', id: 'm1', title: 'Morning routine', hm: '7:30', ap: 'AM', repeat: 'Every day' },
      { g: 'Morning', id: 'm2', title: 'Sunscreen, SPF 50', hm: '8:00', ap: 'AM', repeat: 'Every day' },
      { g: 'Daytime', id: 'd1', title: 'Reapply sunscreen', hm: '1:00', ap: 'PM', repeat: 'Weekdays' },
      { g: 'Evening & night', id: 'e1', title: 'Moisturise forearm', hm: '6:00', ap: 'PM', repeat: 'Every day', caseName: 'Dermatitis' },
      { g: 'Evening & night', id: 'n1', title: 'Night routine', hm: '10:30', ap: 'PM', repeat: 'Every day' },
      { g: 'Evening & night', id: 'n2', title: 'Spot gel on jawline', hm: '10:30', ap: 'PM', repeat: 'Mon, Wed, Fri', caseName: 'Acne' }
    ];
    const all = [...base, ...this.state.extra];
    const on = this.state.on;
    const track = (v) => 'width: 52px; height: 30px; flex-shrink: 0; padding: 3px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; box-sizing: border-box; ' + (v ? 'border: 1.5px solid #16587B; background: #16587B; justify-content: flex-end;' : 'border: 1.5px solid #16587B; background: transparent; justify-content: flex-start;');
    const knob = (v) => v ? '#F5EEDD' : '#16587B';
    const groups = ['Morning', 'Daytime', 'Evening & night'].map((name) => ({
      name,
      items: all.filter((r) => r.g === name).map((r) => {
        const v = on[r.id] !== false;
        return { ...r, hasCase: !!r.caseName, noCase: !r.caseName, pressed: String(v), opacity: v ? '1' : '0.55', track: track(v), knob: knob(v), toggle: () => set({ on: { ...on, [r.id]: !v } }) };
      })
    }));
    const chip = (sel) => 'min-height: 44px; padding: 0 14px; border-radius: 6px; cursor: pointer; font: ' + (sel ? '400' : '300') + ' 14px Poppins, sans-serif; ' + (sel ? 'border: 1.5px solid #16587B; background: #16587B; color: #F5EEDD;' : 'border: 1px solid #C9C1AA; background: transparent; color: #0F3D56; margin: 0.5px;');
    const types = ['Medication', 'Sunscreen', 'Morning routine', 'Night routine', 'Custom'].map((l) => ({ label: l, pressed: String(this.state.type === l), style: chip(this.state.type === l), pick: () => set({ type: l }) }));
    const presets = { 'Every day': [0, 1, 2, 3, 4, 5, 6], 'Weekdays': [0, 1, 2, 3, 4], 'Weekends': [5, 6] };
    const repeats = ['Every day', 'Weekdays', 'Weekends', 'Custom'].map((l) => ({ label: l, pressed: String(this.state.repeat === l), style: chip(this.state.repeat === l), pick: () => set({ repeat: l, days: presets[l] || this.state.days }) }));
    const dn = [['M', 'Monday'], ['T', 'Tuesday'], ['W', 'Wednesday'], ['T', 'Thursday'], ['F', 'Friday'], ['S', 'Saturday'], ['S', 'Sunday']];
    const days = dn.map(([s, full], i) => {
      const sel = this.state.days.includes(i);
      return { short: s, full, pressed: String(sel), pick: () => set({ repeat: 'Custom', days: sel ? this.state.days.filter((d) => d !== i) : [...this.state.days, i] }),
        style: 'height: 44px; border-radius: 4px; cursor: pointer; font: 500 13px Fustat, sans-serif; ' + (sel ? 'border: 0; background: #84B3CE; color: #0F3D56;' : 'border: 1px solid #C9C1AA; background: transparent; color: #4D6878;') };
    });
    return {
      groups, types, repeats, days,
      draftName: this.state.name, onName: (e) => set({ name: e.target.value }),
      nudgeStr: String(this.state.nudge), nudgeTrack: track(this.state.nudge), nudgeKnob: knob(this.state.nudge), toggleNudge: () => set({ nudge: !this.state.nudge }),
      save: () => {
        const id = 'x' + this.state.extra.length;
        set({ extra: [...this.state.extra, { g: 'Evening & night', id, title: this.state.name || 'New reminder', hm: '6:00', ap: 'PM', repeat: this.state.repeat, caseName: 'Dermatitis' }] });
      }
    };
  }
}
</script>
</body>
</html>
