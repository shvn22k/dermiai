<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DermiAI sidebar navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Poppins:wght@300;400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 860px; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 36px; background: #FBF7EC; font-family: 'Poppins', system-ui, sans-serif; font-weight: 300; color: #0F3D56">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #16587B">
<dc-import name="Dermi" size="38" mood="happy" hint-size="38px,38px"></dc-import>
<span style="font-family: 'Ortica', 'Newsreader', Georgia, serif; font-weight: 300; font-size: 27px; letter-spacing: -0.02em">DermiAI</span>
</a>
<div style="display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #D8D2C0; padding-top: 14px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
<span style="font-family: 'Fustat', system-ui, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.1em; color: {{item.numColor}}; width: 20px">{{item.num}}</span>
<span>{{item.label}}</span>
</a>
</sc-for>
</div>
<a href="Consultation.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border-radius: 8px; background: #16587B; color: #F5EEDD; text-decoration: none; font-family: 'Fustat', system-ui, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">New consultation <span aria-hidden="true" style="font-size: 18px; letter-spacing: 0">+</span></a>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; padding-top: 14px; border-top: 1px solid #D8D2C0; color: #4D6878; font-size: 13px; line-height: 1.55">Dermi supports, not replaces, a dermatologist.</p>
<a href="Onboarding.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; color: #0F3D56">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #84B3CE; color: #0F3D56; display: flex; align-items: center; justify-content: center; font-family: 'Fustat', system-ui, sans-serif; font-weight: 600; font-size: 14px">AR</span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 400; font-size: 14px">Aanya Rao</span><span style="font-size: 12px; color: #4D6878">Combination · Type IV</span></span>
</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","cases","reminders","ingredients","profile"]},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 6px; text-decoration: none; font-size: 15px; box-sizing: border-box;';
    const nav = [
      { id: 'dashboard', label: 'Dashboard', href: 'Dashboard.dc.html' },
      { id: 'cases', label: 'Cases', href: 'CaseDetail.dc.html' },
      { id: 'reminders', label: 'Reminders', href: 'Reminders.dc.html' },
      { id: 'ingredients', label: 'Ingredient check', href: 'IngredientCheck.dc.html' },
      { id: 'profile', label: 'Profile', href: 'Onboarding.dc.html' }
    ];
    const items = nav.map((n, i) => ({
      ...n,
      num: '0' + (i + 1),
      current: n.id === active ? 'page' : 'false',
      numColor: n.id === active ? '#16587B' : '#4D6878',
      style: base + (n.id === active ? ' background: #D5E5EE; color: #16587B; font-weight: 500;' : ' background: transparent; color: #0F3D56; font-weight: 300;')
    }));
    return { items };
  }
}
</script>
</body>
</html>
