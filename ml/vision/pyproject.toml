[project]
name = "dermiai-vision"
version = "0.1.0"
description = "DermiAI CNN skin-condition classifier"
requires-python = ">=3.11,<3.12"
# Base deps are light so CI and config validation never download torch.
dependencies = [
  "dermiai-schemas",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# uv sync --package dermiai-vision --extra train
train = [
  "torch>=2.5",
  "torchvision>=0.20",
  "timm>=1.0",
  "albumentations>=1.4",
  "scikit-learn>=1.5",
  "wandb>=0.18",
]
# uv sync --package dermiai-vision --extra serve   (SSE inference endpoint; torch comes from `train` too)
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27", "pillow>=11.0"]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.15", "ruff>=0.11", "types-PyYAML"]

[tool.uv.sources]
dermiai-schemas = { workspace = true }
# For CUDA wheels, pin torch to a PyTorch index (decide with the GPU target), e.g.
#   torch = { index = "pytorch-cu124" }
# plus a [[tool.uv.index]] entry in the root pyproject.toml.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dermiai_vision"]
