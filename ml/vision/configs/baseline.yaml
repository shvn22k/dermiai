# PLACEHOLDER baseline. Vision owner: replace values once the dataset is chosen.
kind: vision_train
experiment:
  name: vision-baseline
  description: Pretrained CNN baseline
  seed: 42

data:
  dataset_dir: data/processed/vision/dataset-v1
  image_size: 224
  num_classes: 7 # TBD by label set

model:
  backbone: efficientnet_b0
  pretrained: true

optim:
  learning_rate: 3.0e-4
  batch_size: 32
  num_epochs: 20

top_k: 3
output_dir: outputs/vision/vision-baseline

tracking:
  project: dermiai-vision
  tags: [baseline]
