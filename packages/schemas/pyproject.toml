[project]
name = "dermiai-schemas"
version = "0.1.0"
description = "Shared data contracts (Pydantic + JSON Schema) between DermiAI vision, LLM and API"
requires-python = ">=3.11,<3.12"
# Keep this package dependency-light: every other area depends on it.
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.15", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dermiai_schemas"]
