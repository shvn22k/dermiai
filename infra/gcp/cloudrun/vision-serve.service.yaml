# PLACEHOLDER Cloud Run service for the CNN endpoint (CPU). Replace ALL_CAPS values.
# gcloud run services replace infra/gcp/cloudrun/vision-serve.service.yaml --region REGION
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dermiai-vision-serve
  labels:
    app: dermiai
    component: vision-serve
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: dermiai-vision@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/dermiai/vision-serve:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: MODEL_URI
              value: gs://dermiai-artifacts/vision/MODEL_VERSION
            - name: MODEL_ENDPOINT_TOKEN # must match the Vercel env var (bearer auth mode)
              valueFrom:
                secretKeyRef:
                  name: MODEL_ENDPOINT_TOKEN
                  key: latest
